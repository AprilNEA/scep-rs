[package]
name = "scep-cli"
description = "SCEP (RFC 8894) command line: getcacaps, getcacert, enroll, and a file-backed test CA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "scep"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
clap = { version = "4.6.7", features = ["derive"] }
http = "1"
scep.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
