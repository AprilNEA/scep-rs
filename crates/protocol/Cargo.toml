[package]
name = "scep-protocol"
description = "SCEP (RFC 8894) wire format: attributes, capabilities, pkiMessage, pkcsPKIEnvelope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
base64 = "0.23"
bytes = "1"
cms = { version = "0.3.0-rc.1", default-features = false, features = ["std"] }
const-oid = { version = "0.10", features = ["db"] }
der = { version = "0.8", features = ["alloc", "oid", "ber", "pem"] }
form_urlencoded = "1"
http = "1"
pkcs1 = { version = "0.8", features = ["pem", "std"] }
pkcs8 = { version = "0.11", features = ["pem", "std"] }
rsa = "=0.10.0-rc.21"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
x509-cert = { version = "0.3", features = ["pem"] }

[lints]
workspace = true
