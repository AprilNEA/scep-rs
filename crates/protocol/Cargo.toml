[package]
name = "scep-protocol"
description = "SCEP (RFC 8894) wire format: attributes, capabilities, pkiMessage, pkcsPKIEnvelope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
aes = "0.9"
base64.workspace = true
bytes.workspace = true
cbc = { version = "0.2", features = ["alloc"] }
cms.workspace = true
const-oid.workspace = true
der.workspace = true
form_urlencoded = "1"
getrandom.workspace = true
http.workspace = true
pkcs1 = { version = "0.8", features = ["pem", "std"] }
pkcs8 = { version = "0.11", features = ["pem", "std"] }
rand.workspace = true
rsa = { version = "0.10", features = ["pkcs1v15"] }
sha2.workspace = true
signature.workspace = true
strum.workspace = true
thiserror.workspace = true
x509-cert = { version = "0.3", features = ["builder", "hazmat", "pem"] }
zeroize.workspace = true

[lints]
workspace = true
