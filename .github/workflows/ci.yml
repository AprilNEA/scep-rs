name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add github:cachix/devenv/v2.1.2
      - name: Report Rust toolchain
        run: devenv shell -- rustc --version --verbose
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep Nix build logs out of Cargo metadata JSON.
          cmd-format: devenv --quiet shell -- {0}
          key: ${{ hashFiles('devenv.lock', 'devenv.yaml') }}
          cache-bin: false
      - name: Check
        run: devenv test
